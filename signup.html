{% extends "_auth_base.html" %}
{% block title %}Sign Up — AutoMod Pro{% endblock %}
{% block sub %}Create your dashboard account{% endblock %}
{% block content %}
<form method="POST" action="{{ url_for('signup') }}">
  <label>Username</label>
  <input type="text" name="username" autofocus required placeholder="Choose a username"
         autocomplete="username" minlength="3"/>

  <label style="margin-top:1rem;">Password</label>
  <div style="position:relative;">
    <input type="password" name="password" id="pw" required placeholder="At least 6 characters"
           autocomplete="new-password" minlength="6"
           style="padding-right:2.8rem;width:100%;box-sizing:border-box;"/>
    <button type="button" onclick="togglePw('pw','eye1open','eye1slash')"
            style="position:absolute;right:0.75rem;top:50%;transform:translateY(-50%);
                   background:none;border:none;cursor:pointer;padding:0;color:var(--muted);"
            aria-label="Show/hide password">
      <svg id="eye1open" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
      <svg id="eye1slash" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
           style="display:none;">
        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
        <line x1="1" y1="1" x2="23" y2="23"/>
      </svg>
    </button>
  </div>

  <label style="margin-top:1rem;">Confirm Password</label>
  <div style="position:relative;">
    <input type="password" name="confirm" id="confirm" required placeholder="Repeat your password"
           autocomplete="new-password"
           style="padding-right:2.8rem;width:100%;box-sizing:border-box;"/>
    <button type="button" onclick="togglePw('confirm','eye2open','eye2slash')"
            style="position:absolute;right:0.75rem;top:50%;transform:translateY(-50%);
                   background:none;border:none;cursor:pointer;padding:0;color:var(--muted);"
            aria-label="Show/hide confirm password">
      <svg id="eye2open" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
      <svg id="eye2slash" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
           style="display:none;">
        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
        <line x1="1" y1="1" x2="23" y2="23"/>
      </svg>
    </button>
  </div>

  <button type="submit" style="margin-top:1.25rem;">Create account</button>
</form>
<div class="alt">Already have an account? <a href="{{ url_for('login') }}">Sign in</a></div>

<script>
function togglePw(inputId, openId, slashId) {
  var input = document.getElementById(inputId);
  var open  = document.getElementById(openId);
  var slash = document.getElementById(slashId);
  if (input.type === 'password') {
    input.type = 'text';
    open.style.display  = 'none';
    slash.style.display = 'block';
  } else {
    input.type = 'password';
    open.style.display  = 'block';
    slash.style.display = 'none';
  }
}
</script>
{% endblock %}
